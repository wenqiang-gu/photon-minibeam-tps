# Frozen legacy reference for tests; independent of user geometry settings.
# Device geometry only. Source, CT, scoring and histories remain workflow settings.
[assembly]
enabled = true

[field]
# Full X/Y openings projected to isocenter; freely configurable, not target-fitted.
width_mm = 100.0
height_mm = 100.0
material = "G4_W"
outer_width_mm = 400.0
outer_height_mm = 400.0
side_margin_mm = 10.0

[mlc]
enabled = true
# Simplified continuous X banks, not individual leaves. All distances from source.
source_to_center_mm = 450.0
thickness_mm = 90.0
round_tip_enabled = true
tip_radius_mm = 170.0
tip_center_z_offset_mm = -7.5

[jaws]
enabled = true
source_to_center_mm = 550.0
thickness_mm = 77.0

[aperture]
enabled = true
type = "slits"
material = "G4_BRASS"
source_to_center_mm = 707.0
thickness_mm = 100.0
width_mm = 156.0
height_mm = 174.0
rotation_x_deg = 0.0
rotation_y_deg = 0.0
brass_frame_thickness_x_mm = 16.0
brass_frame_thickness_y_mm = 25.0
slit_count = 17
slit_entrance_width_mm = 2.0
# Nominal spacing; actual spacing varies slightly with blade angle.
slit_entrance_ctc_mm = 6.0
blade_thickness_mm = 4.0
