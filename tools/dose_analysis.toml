# MHA analysis: X = physical X; Y = physical Z; depth = physical Y from entrance.
# Unlisted MC inputs are deliberately unavailable; measurement-only commands still work.
# All input paths are explicit and relative to this file.
version = 1

[defaults]
agl_ssd_mm = 900.0
mc_ssd_mm = 1000.0
lateral_normalization_mode = "2d"
output_root = "../outputs/dose_analysis"
reference_depth_mm = 100.0
normalization_roi_fraction = 1.0
# Normalization reduces the selected ROI dimensions by this fraction.
# These half-widths also control perpendicular profile averaging.
x_roi_half_width_mm = 25
y_roi_half_width_mm = 25
depths_mm = [5.5, 20.0, 50.0, 100.0]
open_monitor_units = 400.0
slit_monitor_units = 2000.0
ratio_threshold_percent = 1.0
# Lateral-only translations in comparison coordinates, with fixed MHA mapping.
# Positive values move the MC curves toward positive X/Y; override per field below.
mc_shift_x_mm = 0.0
mc_shift_y_mm = 0.0
profile_axis = "x"
pvdr_mc_axis = "y"
# Packaged slit orientation modulates along analysis Y (physical MHA Z).
pvdr_data_axis = "y"
ignore_edge_peaks = true
peak_prominence_fraction = 0.5
# expected_ctc_mm = 9.3
# Omit offsets for automatic coordinate-midpoint centering.
# slit_map_x_offset_mm = 102.3
# slit_map_y_offset_mm = 102.3

