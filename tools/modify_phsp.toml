# Paths are relative to this TOML file; ~ expands to your home directory.
# Original distinct history batches only. The modifier processes complete files.
file_bases = [
  "~/Local/MCGPU/TOPAS/Elekta_Precise_6MV/ELEKTA_PRECISE_6mv_part1",
  "~/Local/MCGPU/TOPAS/Elekta_Precise_6MV/ELEKTA_PRECISE_6mv_part2",
  "~/Local/MCGPU/TOPAS/Elekta_Precise_6MV/ELEKTA_PRECISE_6mv_part3",
  "~/Local/MCGPU/TOPAS/Elekta_Precise_6MV/ELEKTA_PRECISE_6mv_part4",
]
output_dir = "../outputs/modified_phase_space2"
# Retain any nonempty combination; applies to every variant and both directions.
# Example photon-only: ["photon"]; charged particles: ["electron", "positron"].
# Original histories (including those made empty) are preserved. Selection alone
# preserves weights; spectrum/electron scaling can modify retained weights.
particle_types = ["electron"] # ["photon", "electron", "positron"]
seed = 12345 # Modification seed, independent of TOPAS transport seeds.

# Source-to-output-plane distance, mm; applies to every variant and species.
# 272.1 preserves the original plane. Smaller values move it upstream.
# Scale X/Y along lines from nominal source (0,0,0) to recorded positions.
# Applied AFTER focal spread; particle directions remain unchanged.
# Changes downstream trajectories: source modification, not vacuum transport.
output_plane_distance_mm = 272.1

# Spectrum weights are unchanged through 0.1 MeV, transition smoothly to
# the model ratio at 0.2 MeV, and preserve the protected 511 keV band.
# No source spread is added unless you explicitly configure a positive sigma.
# Each enabled variant writes a COMPLETE copy of the input particle files.
# [variants.energy_low]
# spectrum = "peak_minus_0p1"
# source_sigma_x_mm = 0.0
# source_sigma_y_mm = 0.0

# [variants.energy_high]
# spectrum = "peak_plus_0p1"
# source_sigma_x_mm = 0.0
# source_sigma_y_mm = 0.0

# [variants.electron]
# spectrum = "baseline"
# source_sigma_x_mm = 0.0
# source_sigma_y_mm = 0.0

# [variants.focalspread]
# spectrum = "baseline"
# source_sigma_x_mm = 1.0 # Example only; effective spread ADDED at source plane.
# source_sigma_y_mm = 2.0 # Positions stay fixed unless output plane changes.

# [variants.joint_example]
# spectrum = "peak_plus_0p1"
# source_sigma_x_mm = 0.5
# source_sigma_y_mm = 0.5

# [variants.custom_example]
# spectrum = "custom"
# C1 = 1.120813595915993
# C2 = 4.174177344588501
# C3 = -1.276750337246975

# Automatic model-13 coefficients for a requested continuum-peak change.
# Existing peak_minus_0p1/peak_plus_0p1 presets are ±0.1 MeV, NOT ±10%.
# Use exactly one shift unit. Zero keeps the baseline coefficients.
# [variants.peak_example]
# spectrum = "peak_shift"
# peak_shift_mev = 0.05
# Alternative: peak_shift_percent = 10.0
# The fitted smooth-model peak can differ from the empirical output peak.
# Every normal run writes output_dir/spectrum_report.pdf plus per-variant PNG/CSV.

# [variants.mpv_minus0p05]
# spectrum = "peak_shift"
# peak_shift_mev = -0.05

# [variants.mpv_minus0p1]
# spectrum = "peak_shift"
# peak_shift_mev = -0.1

# [variants.mpv_plus0p05]
# spectrum = "peak_shift"
# peak_shift_mev = 0.05

# [variants.mpv_plus0p1]
# spectrum = "peak_shift"
# peak_shift_mev = 0.1

# [variants.mpv_plus1]
# spectrum = "peak_shift"
# peak_shift_mev = 1.0

# Smooth exponential photon-spectrum tilt. Positive alpha hardens; negative softens.
# alpha is in MeV^-1 (not a percentage). Does not change particle energies.
# Total photon weight and protected 511-keV weights remain unchanged.
# Choose a fresh output_dir. Alpha is separate from the peak-shift modes.
# [variants.harder]
# spectrum = "alpha"
# alpha_per_mev = 0.1

# Optional per-variant incident-electron statistical weight multiplier.
# Default is 1.0; positive finite values only. Photons/positrons and histories
# are unchanged; no renormalization follows this scaling. Secondary electrons
# generated during TOPAS transport are not scaled. If electrons are excluded
# by particle_types, this setting has no effect.
# [variants.alpha02_electron_tuned]
# spectrum = "alpha"
# alpha_per_mev = 0.2
# electron_weight_scale = 2.637
# Fit example: ROI ±25 mm, normalization at 100 mm, excluding measurement 0/1 mm.

[variants.electron]
spectrum = "baseline"

# 
# [variants.focal_spread_1_2_bestfit_alpha_electron]
# electron_weight_scale = 2.637
# spectrum = "alpha"
# alpha_per_mev = 0.2
# source_sigma_x_mm = 1.0
# source_sigma_y_mm = 2.0
# 
# [variants.focal_spread_1p5_3_bestfit_alpha_electron]
# electron_weight_scale = 2.637
# spectrum = "alpha"
# alpha_per_mev = 0.2
# source_sigma_x_mm = 1.5
# source_sigma_y_mm = 3.0
