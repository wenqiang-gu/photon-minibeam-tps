# Device geometry only. Source, CT, scoring and histories remain workflow settings.
[assembly]
enabled = true

[field]
# PROJECTED: full X/Y field openings at workflow reference plane, mm.
# Patient: isocenter (SAD); water: entrance plane (SSD). Not the fixed jaw drawing reference.
width_mm = 100.0
height_mm = 100.0
# MATERIAL: TOPAS material name shared by MLC and jaws.
material = "G4_W"
# PHYSICAL: minimum travel-axis material margin beyond the opening, mm.
side_margin_mm = 10.0

[mlc]
# Minimum physical separation between opposing tips at the MLC bank.
# Applies to model = "leaves"; not projected to the reference plane.
# Pairs below this gap move apart symmetrically, including small open pairs.
# Elekta Agility BLD tutorial (2021), PDF pp. 75-76: Closed Leaf Constraint.
# This is distinct from the 90 micrometre gap between adjacent leaves.
minimum_leaf_gap_mm = 1.0
# Opt in to a static individual-leaf shape; default keeps continuous banks.
model = "simple" # "simple": two continuous blocks; "leaves" enables the CSV/RTPLAN shape
# SELECTOR (leaves only): CSV or DICOM RTPLAN; static shape applied to workflow beams.
shape_source = "csv" # or "rtplan"
# PATH (leaves only): relative to this TOML, or absolute; resolved during preparation.
shape_file = "mlc_shape_example.csv" # relative to this TOML; absolute paths also work
# IDENTIFIER (RTPLAN only): DICOM BeamNumber, not the workflow beam index.
shape_beam_number = 1 # DICOM BeamNumber (RTPLAN only)
# INDEX (RTPLAN only): zero-based control point, with inherited positions.
shape_control_point_index = 0 # zero-based; inherited positions supported
# PHYSICAL: rigid length of ONE leaf along beam X, mm; leaves model only.
leaf_length_mm = 155.0 # approximate length from supplied Elekta leaf drawing

# Fixed pair envelope X/Y, including opening; approximate continuous banks.
# Motivated by leaf dimensions, not a verified manufacturer bank envelope.
# PHYSICAL: full fixed pair envelope along beam X, including opening, mm; simple model.
outer_width_mm = 310.0
# PHYSICAL: full bank span along beam Y, mm; simple envelope; leaves also check transverse containment against this span.
outer_height_mm = 160.0
# Switch: include MLC geometry; independent of jaws and slit aperture.
enabled = true
# Axial body center, not tip-curvature center; all distances from source.
# Elekta Agility BLD tutorial (2021), PDF pp. 9 and 17:
# tip-curvature center = 349.3 mm; body center = 349.3 + (90/2 - 37.5).
# Thus 356.8 - 7.5 = 349.3 mm; entrance/exit = 311.8/401.8 mm.
source_to_center_mm = 356.8
# PHYSICAL: MLC axial thickness along beam Z, mm; both models.
thickness_mm = 90.0
# Switch: use curved tips; both models. False uses flat-tip geometry.
round_tip_enabled = true
# PHYSICAL: leaf/bank tip radius in X/Z plane, mm; active for rounded tips.
tip_radius_mm = 170.0
# PHYSICAL SIGNED: tip-curvature center relative to body center, mm; negative is upstream.
tip_center_z_offset_mm = -7.5


[jaws]
# Agility-inspired approximation, not a verified EVO manufacturing model.
# Elekta Agility BLD tutorial (2021), PDF pp. 11, 16, 66 and 70:
# outline coordinates are approximate graph readings; 35 mm thin material and
# the 350 mm rear endpoint are assumptions, not specified manufacturing dimensions.
# US20100166150A1, Figures 5-7: the thick front band spans the FULL body width.
# https://patents.google.com/patent/US20100166150A1/en
# Native extruded pieces; MLC controller constraints behind the jaws are not modeled.
model = "y_shaped" # "uniform": legacy fixed envelope with physical outer_width_mm/outer_height_mm
# FIXED DRAWING REFERENCE: source-to-reference distance, mm; NOT workflow SAD/SSD.
# Physical dimensions = projected drawing dimensions * source_to_center_mm / this distance.
outline_reference_distance_mm = 1000.0
# PROJECTED: [distance behind nominal radiation edge along jaw travel, X half-width], mm.
# One jaw: first half-width defines full body width; final distance defines its length.
# Negative jaw mirrors this shape. The thin base retains the full width behind the front.
outline_points_mm = [
    [0.0, 205.0],   # full-width front
    [30.0, 205.0],  # taper begins
    [210.0, 30.0],  # taper ends; narrow spine begins
    [350.0, 30.0],  # rear endpoint
]
# PHYSICAL: upstream thin-base axial thickness, mm; never projected.
thin_region_thickness_mm = 35.0
# Published curved-tip dimensions: Karl N. Sachse (2019), section 3.1.1.2.3,
# Table 3-15, p. 3-19 (PDF p. 83):
# https://scholar.ufs.ac.za/bitstreams/ecf5466d-0410-4e41-8194-c11ac02b5f56/download#page=83
# At body center 470.5 and thickness 77: entrance/exit 432/509 mm;
# curvature center = 470.5 - 3.5 = 467 mm. Thin base (35 mm): 432-467 mm.
# Switch: include these jaws; independent of the MLC and slit aperture.
enabled = true
# PHYSICAL AXIAL: source to body midpoint along beam Z, mm (not curvature center).
source_to_center_mm = 470.5
# PHYSICAL: total axial thickness in the thick regions, mm.
thickness_mm = 57.0 # 77.0
# Switch: rounded tangent tip; false uses the existing focused flat face.
round_tip_enabled = true
# PHYSICAL: radius of the field-defining tip in the Y/Z plane, mm.
tip_radius_mm = 135.0
# PHYSICAL SIGNED: curvature center relative to body center, mm; negative is upstream.
tip_center_z_offset_mm = -3.5

[aperture]
enabled = true
type = "slits"
material = "G4_BRASS"
source_to_center_mm = 707.0
thickness_mm = 100.0
width_mm = 156.0
height_mm = 174.0
rotation_x_deg = 0.0
rotation_y_deg = 0.0
# Shared baseline: slit length along beam X, between the MLC banks.
rotation_z_deg = -90.0
brass_frame_thickness_x_mm = 16.0
brass_frame_thickness_y_mm = 25.0
slit_count = 17
slit_entrance_width_mm = 2.0
# Nominal spacing; actual spacing varies slightly with blade angle.
slit_entrance_ctc_mm = 6.0
blade_thickness_mm = 4.0

# Rigid translation of the whole slit assembly along rotated aperture-local X (across slits).
lateral_shift_mm = 0.0
