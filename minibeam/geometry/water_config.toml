# Device geometry only. Source, CT, scoring and histories remain workflow settings.
[assembly]
enabled = true

[field]
# Full X/Y openings projected to isocenter; freely configurable, not target-fitted.
width_mm = 100.0
height_mm = 100.0
material = "G4_W"
side_margin_mm = 10.0

[mlc]
# Minimum physical separation between opposing tips at the MLC bank.
# Applies to model = "leaves"; not projected to the reference plane.
# Pairs below this gap move apart symmetrically, including small open pairs.
# Elekta Agility BLD tutorial (2021), PDF pp. 75-76: Closed Leaf Constraint.
# This is distinct from the 90 micrometre gap between adjacent leaves.
minimum_leaf_gap_mm = 1.0
# Opt in to a static individual-leaf shape; default keeps continuous banks.
model = "leaves" # two continuous blocks; "leaves" enables the CSV/RTPLAN shape
shape_source = "csv" # or "rtplan"
shape_file = "mlc_shape_example.csv" # relative to this TOML; absolute paths also work
shape_beam_number = 1 # DICOM BeamNumber (RTPLAN only)
shape_control_point_index = 0 # zero-based; inherited positions supported
leaf_length_mm = 155.0 # approximate length from supplied Elekta leaf drawing

# Fixed pair envelope X/Y, including opening; approximate continuous banks.
# Motivated by leaf dimensions, not a verified manufacturer bank envelope.
outer_width_mm = 310.0
outer_height_mm = 160.0
enabled = true
# Axial body center, not tip-curvature center; all distances from source.
# Elekta Agility BLD tutorial (2021), PDF pp. 9 and 17:
# tip-curvature center = 349.3 mm; body center = 349.3 + (90/2 - 37.5).
# Thus 356.8 - 7.5 = 349.3 mm; entrance/exit = 311.8/401.8 mm.
source_to_center_mm = 356.8
thickness_mm = 90.0
round_tip_enabled = true
tip_radius_mm = 170.0
tip_center_z_offset_mm = -7.5

[jaws]
# Fixed pair envelope X/Y, including opening; user-estimated rectangular body.
# Not manufacturer dimensions; sculpted Y-shaped body is deferred.
outer_width_mm = 230.0
outer_height_mm = 310.0
enabled = true
# Sculpted diaphragm reference: Elekta, "Collimation apparatus for radiotherapy",
# US20100166150A1, Figures 5-7 (Y-shaped body and its shielding relationship to MLC leaves):
# https://patents.google.com/patent/US20100166150A1/en
# The current rectangular, uniform-thickness jaw does not implement that sculpting.
# The patent is not the source of our estimated 230 x 310 mm pair envelope.
# Agility-inspired uniform-thickness approximation, not the full sculpted EVO jaw.
# Karl N. Sachse (2019), section 3.1.1.2.3, Table 3-15, p. 3-19 (PDF p. 83):
# https://scholar.ufs.ac.za/bitstreams/ecf5466d-0410-4e41-8194-c11ac02b5f56/download#page=83
# Published radius = 135 mm; offset derived as 467 - (432 + 77/2) = -3.5 mm.
# Reference body midpoint = 432 + 77/2 = 470.5 mm; curvature center = 467 mm.
# With the 77 mm thickness and -3.5 mm offset, entrance/exit = 432/509 mm.
# Material and outer dimensions remain our existing approximations.
source_to_center_mm = 470.5
thickness_mm = 77.0
round_tip_enabled = true
tip_radius_mm = 135.0
tip_center_z_offset_mm = -3.5

[aperture]
enabled = true
type = "slits"
material = "G4_BRASS"
source_to_center_mm = 707.0
thickness_mm = 100.0
width_mm = 156.0
height_mm = 174.0
rotation_x_deg = 0.0
rotation_y_deg = 0.0
# Shared baseline: slit length along beam X, between the MLC banks.
rotation_z_deg = -90.0
brass_frame_thickness_x_mm = 16.0
brass_frame_thickness_y_mm = 25.0
slit_count = 17
slit_entrance_width_mm = 2.0
# Nominal spacing; actual spacing varies slightly with blade angle.
slit_entrance_ctc_mm = 6.0
blade_thickness_mm = 4.0

# Rigid translation of the whole slit assembly along rotated aperture-local X (across slits).
lateral_shift_mm = 0.0
